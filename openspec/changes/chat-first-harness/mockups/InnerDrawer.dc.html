<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project switcher</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./m3e.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&amp;family=Google+Sans+Code:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#00696E}a:hover{color:#004F53}
</style>
</helmet>
<div class="m3" style="width: 840px; height: 740px; position: relative; overflow: hidden; background: var(--surface)">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex">
    <div class="rail" style="padding: 0"></div>
    <div style="width: 364px; margin: 8px 0; border-radius: 28px 0 0 28px; background: var(--sc-low); padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
      <div class="title-m">Resume after drops</div>
      <div style="height: 48px; border-radius: 18px; background: var(--sc-highest)"></div>
    </div>
    <div style="width: 16px"></div>
    <div style="flex: 1; margin: 8px 8px 8px 0; border-radius: 0 28px 28px 0; background: var(--sc-low); padding: 20px; display: flex; flex-direction: column; gap: 10px">
      <div class="title-e" style="font-size: 20px">Beads</div>
      <div style="height: 92px; border-radius: 20px; background: var(--sc-lowest)"></div>
      <div style="height: 92px; border-radius: 20px; background: var(--sc-lowest)"></div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: var(--scrim)"></div>

  <aside role="dialog" aria-label="Projects" style="position: absolute; left: 0; top: 0; bottom: 0; width: 380px; background: var(--sc-low); border-radius: 0 28px 28px 0; box-shadow: var(--shadow-3); display: flex; flex-direction: column; padding: 16px 12px">
    <div style="display: flex; align-items: center; gap: 4px; padding: 0 4px 0 12px; height: 56px">
      <h2 class="headline-s" style="margin: 0; flex: 1;">Projects</h2>
      <button class="icon-btn" aria-label="Search projects"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
      <button class="icon-btn" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg></button>
    </div>
    <div style="padding: 4px 12px 12px">
      <div class="group" role="group" aria-label="Show">
        <button class="seg" aria-pressed="false">All</button>
        <button class="seg on" aria-pressed="true"><svg class="ic xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Needs you 3</button>
        <button class="seg" aria-pressed="false">Working</button>
      </div>
    </div>

    <div class="title-s muted" style="padding: 8px 16px; display: flex; align-items: center; gap: 8px"><span class="dot" style="background: var(--primary)"></span>Mac Studio</div>
    <div class="seglist">
    <a href="Inner.dc.html" aria-current="true" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 10px 14px; background: var(--secondary-container); color: var(--on-secondary-container); text-decoration: none">
      <span class="shape-cookie" style="width: 44px; height: 44px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font: 700 18px/1 var(--font); flex: none">N</span>
      <div style="flex: 1; min-width: 0"><div class="label-l" style="font-size: 16px; line-height: 22px">Nacre</div><div class="body-s">Round stopped · approve chat-first-harness</div></div>
      <span class="pill" style="background: var(--error-container); color: var(--on-error-container)">2</span>
    </a>
    <a href="Inner.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 10px 14px; color: inherit; text-decoration: none">
      <span class="shape-clover" style="width: 44px; height: 44px; background: var(--tertiary-container); color: var(--on-tertiary-container); display: flex; align-items: center; justify-content: center; font: 700 18px/1 var(--font); flex: none">H</span>
      <div style="flex: 1; min-width: 0"><div class="label-l" style="font-size: 16px; line-height: 22px">HomeAgentic</div><div class="body-s muted">Codex asks to run npm install</div></div>
      <span class="pill" style="background: var(--error-container); color: var(--on-error-container)">1</span>
    </a>

    </div>
    <div class="title-s muted" style="padding: 20px 16px 8px; display: flex; align-items: center; gap: 8px"><span class="dot" style="background: var(--outline)"></span>MacBook Air <span class="body-s">· last checked 12 min ago</span></div>
    <div class="body-m muted" style="padding: 4px 16px">Offline: its projects can't report what needs you.</div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":740}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
